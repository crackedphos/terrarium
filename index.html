<!DOCTYPE html> <!-- Declares the document type and version of HTML being used, as in HTML5 Establishes modern web standards for proper browser rendering and Ensures consistent display across different browsers and devices -->
<html lang="en"> <!-- html is a root element that contain all page content, root element is the top-level element in an HTML document, and it is used to define the beginning and end of the document -->
<head>
	<title>Welcome to my Virtual Terrarium</title> <!-- defines the title of the document, which is displayed in the browser's title bar or tab. It is important for SEO and accessibility, as it provides context about the content of the page. -->
	<meta charset="utf-8" /> <!-- specifies the character encoding for the HTML document, ensuring that text is displayed correctly across different browsers and devices. UTF-8 is a widely used encoding that supports a wide range of characters from various languages. -->
	<meta http-equiv="X-UA-Compatible" content="IE=edge" /> <!-- instructs Internet Explorer to use the latest rendering engine available, ensuring that the page is displayed correctly and takes advantage of modern web standards. This helps maintain compatibility with older versions of IE while promoting better performance and rendering. -->
	<meta name="viewport" content="width=device-width, initial-scale=1" /> <!-- sets the viewport properties for responsive web design, ensuring that the page scales correctly on different devices and screen sizes. The width=device-width property makes the page's width match the device's screen width, while initial-scale=1 sets the initial zoom level to 100%, providing a better user experience on mobile devices. -->
    <link rel="stylesheet" href="./style.css" />
</head>
    <body>
        <main id="page">
            <header>
                <h1 style="color: red">My Terrarium</h1>
            </header>

            <aside id="left-container" class="container" aria-label="Left plant selection">
                <div class="plant-holder">
                    <img class="plant" alt="Trailing string of pearls succulent vine" id="plant1" src="./images/plant1.png" />
                </div>
                <div class="plant-holder">
                    <img class="plant" alt="Dark green rosette succulent with pointed fleshy leaves" id="plant2" src="./images/plant2.png" />
                </div>
                <div class="plant-holder">
                    <img class="plant" alt="Blush pink succulent rosette" id="plant3" src="./images/plant3.png" />
                </div>
                <div class="plant-holder">
                    <img class="plant" alt="Dense bushy cluster of small green leaves" id="plant4" src="./images/plant4.png" />
                </div>
                <div class="plant-holder">
                    <img class="plant" alt="Slender branch with elongated bluish-green leaves" id="plant5" src="./images/plant5.png" />
                </div>
                <div class="plant-holder">
                    <img class="plant" alt="Curved leafy twig with smooth green foliage" id="plant6" src="./images/plant6.png" />
                </div>
                <div class="plant-holder">
                    <img class="plant" alt="Bright green upright succulent with thick rounded petals" id="plant7" src="./images/plant7.png" />
                </div>
            </aside>

            <aside id="right-container" class="container" aria-label="Right plant selection">
                <div class="plant-holder">
                    <img class="plant" alt="Tall columnar cactus stems topped with fuzzy orange flowers" id="plant8" src="./images/plant8.png" />
                </div>
                <div class="plant-holder">
                    <img class="plant" alt="Frosty mint-green open succulent rosette" id="plant9" src="./images/plant9.png" />
                </div>
                <div class="plant-holder">
                    <img class="plant" alt="Upright aloe succulent with serrated leaves and brownish tips" id="plant10" src="./images/plant10.png" />
                </div>
                <div class="plant-holder">
                    <img class="plant" alt="Narrow oval cactus covered in fine white bristly spines" id="plant11" src="./images/plant11.png" />
                </div>
                <div class="plant-holder">
                    <img class="plant" alt="Tillandsia air plant with curving silvery-pink pointed leaves" id="plant12" src="./images/plant12.png" />
                </div>
                <div class="plant-holder">
                    <img class="plant" alt="Prickly pear cactus with clustered flat green pads" id="plant13" src="./images/plant13.png" />
                </div>
                <div class="plant-holder">
                    <img class="plant" alt="Spherical round barrel cactus covered in soft white fuzz and spines" id="plant14" src="./images/plant14.png" />
                </div>
            </aside>

            <section id="terrarium" aria-label="Virtual Terrarium Jar"> <!-- Creates a main terrarium container for styling -->
                <div class="jar-top"></div> <!-- Represents the top part of the terrarium jar, which can be styled to look like glass or a lid -->
                <div class="jar-walls"> <!-- Represents the walls of the terrarium jar, which can be styled to look like transparent glass -->
                    <div class="jar-glossy-long"></div> <!-- Represents a long glossy reflection effect on the jar walls, enhancing the glass appearance -->
                    <div class="jar-glossy-short"></div> <!-- Represents a short glossy reflection effect on the jar walls, enhancing the glass appearance -->
                </div>
                <div class="dirt"></div>
                <div class="jar-bottom"></div>
            </section>
        </main>        
    </body>
</html>
